name: checks
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo fmt --check && cargo test
      - run: npm --prefix frontend ci && npm --prefix frontend test && npm --prefix frontend run build
      - run: node --test scripts/audit-frontend.test.mjs && node scripts/audit-frontend.mjs
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - run: cargo build
      - name: Docker API integration
        timeout-minutes: 8
        env:
          COMPMASTER_DOCKER_TESTS: '1'
          DOCKER_HOST: unix:///var/run/docker.sock
        run: cargo test -- --ignored && node scripts/test-setup.mjs && node scripts/test-api.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: compmaster:ci
          load: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - run: docker run --rm --entrypoint /usr/local/bin/docker compmaster:ci compose version
      - run: node scripts/test-image.mjs compmaster:ci
      - run: COMPMASTER_TEST_UID="$(id -u)" COMPMASTER_TEST_GID="$(id -g)" node scripts/test-image.mjs compmaster:ci
      - run: test "$(docker image inspect --format '{{.Config.User}}' compmaster:ci)" = '65532:65532'
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: compmaster:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Export validated image
        run: docker save --output "$RUNNER_TEMP/compmaster-${{ matrix.arch }}.tar" compmaster:ci
      - uses: actions/upload-artifact@v4
        with:
          name: compmaster-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/compmaster-${{ matrix.arch }}.tar
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
