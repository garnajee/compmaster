name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish multi-platform manifest
    needs: validate
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set registry image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - uses: actions/download-artifact@v4
        with:
          pattern: compmaster-image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested images and assemble manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_SHA: ${{ github.sha }}
          METADATA: ${{ steps.meta.outputs.json }}
          IMAGE_DIRECTORY: ${{ runner.temp }}/images
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            docker load --input "$IMAGE_DIRECTORY/compmaster-$arch.tar"
            test "$(docker image inspect compmaster:ci --format '{{.Os}}/{{.Architecture}}')" = "linux/$arch"
            reference="$IMAGE:sha-$COMMIT_SHA-$arch"
            docker tag compmaster:ci "$reference"
            docker push "$reference"
            digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -er '.digest')"
            sources+=("$IMAGE@$digest")
          done

          arguments=()
          while IFS= read -r tag; do
            arguments+=(--tag "$tag")
          done < <(jq -er '.tags[]' <<< "$METADATA")
          test "${#arguments[@]}" -gt 0
          docker buildx imagetools create "${arguments[@]}" "${sources[@]}"

          manifest="$IMAGE:sha-$COMMIT_SHA"
          docker buildx imagetools inspect "$manifest" --raw | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          {
            echo '## Published container images'
            jq -r '.tags[] | "- `" + . + "`"' <<< "$METADATA"
            echo ''
            echo 'Platforms: `linux/amd64`, `linux/arm64`.'
            echo 'Images were tested and scanned before publication.'
          } >> "$GITHUB_STEP_SUMMARY"
